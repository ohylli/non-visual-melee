# The fork's CI release: every push to master builds the Windows x86_64
# package and publishes it as the rolling prerelease ci-latest, so the newest
# build is one plain download link away.
#
# Fork-owned file, so base merges never conflict here. The base port's own
# workflows (build.yml, pages.yml) stay in the tree but are disabled in the
# fork's GitHub settings (gh workflow disable); a base merge that adds a
# workflow file needs the same treatment.
name: A11y Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# The newest push wins: an older build still running is cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  ZIP_NAME: NonVisualMelee-Windows-x86_64.zip

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as the base port's Windows job in build.yml.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake zip cabextract curl mingw-w64
          # aurora's C++20 code needs std::thread, which only the POSIX
          # threading model provides.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build and package
        env:
          TARGET_ARCH: x86_64
        run: tools/package_windows.sh

      # The connection checker (src/pc/a11y/netcheck.cpp), beside melee.exe,
      # so a friend testing their network has it in the same download.
      # package_windows.sh builds the melee target alone, so it is built here
      # in the same build directory.
      - name: Add the connection checker
        run: |
          ninja -C build-win melee-netcheck
          cp build-win/melee-netcheck.exe dist/melee-windows-x86_64/
          cd dist
          zip -q Melee-Windows-x86_64.zip melee-windows-x86_64/melee-netcheck.exe

      # package_windows.sh ships prism.dll; Prism's licences (its own and
      # those of the libraries inside it) are added here, beside the game.
      - name: Add Prism licences
        working-directory: dist
        run: |
          prism_dir="$(ls -d ../build-win/prism-*/ | head -n 1)"
          mkdir -p melee-windows-x86_64/LICENSES.prism
          cp -r "${prism_dir}LICENSES/." "${prism_dir}NOTICE" melee-windows-x86_64/LICENSES.prism/
          zip -qr Melee-Windows-x86_64.zip melee-windows-x86_64/LICENSES.prism
          mv Melee-Windows-x86_64.zip "${ZIP_NAME}"
          ls -lh "${ZIP_NAME}"

      # Delete and recreate rather than edit, so the tag always names the
      # commit that was built. The download link stays the same.
      - name: Publish ci-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The newest build of master, rebuilt on every push. Not a tested release."
            echo
            echo "Commit ${GITHUB_SHA::7}, $(git log -1 --format=%cs):"
            echo
            git log -1 --format=%B
          } > notes.md
          gh release delete ci-latest --yes --cleanup-tag || true
          gh release create ci-latest \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Latest CI build" \
            --notes-file notes.md \
            "dist/${ZIP_NAME}"
